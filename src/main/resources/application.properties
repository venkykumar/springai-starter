spring.application.name=springai-starter
logging.level.root=INFO
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.toolcallback.enabled=false
spring.ai.mcp.client.streamable-http.connections.local-nba-mcp.url=http://localhost:${server.port:8080}
spring.ai.mcp.client.streamable-http.connections.local-nba-mcp.endpoint=/mcp
